<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W443 · Design a Multi-Chain Crypto Ledger &amp; Wallet History</title>
<desc id="desc">Chain block or event — network + position; Chain indexer — confirmations + ordering; Canonical chain and transfers — block hashes + cursor; Reorg-aware projection — reversible derived state; Wallet history service — deduplication + reconciliation; Balance and history view — confirmation status. A chain reorganization can invalidate prior observations; retain block identity and rebuild affected derived history.</desc>
