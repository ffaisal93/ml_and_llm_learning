<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W474 · Design a Distributed Blob Cache With a Separate Metadata Index</title>
<desc id="desc">Blob read or put — key + version; Cache coordinator — lookup + admission; Metadata index — location + lifecycle; Transfer or eviction work — bounded retries; Blob storage nodes — verify bytes + pin leases; Blob response — miss fallback + diagnostics. Metadata must not claim an incomplete or evicted object is available; coordinate publication and eviction state.</desc>
