<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W359 · Streaming Social-Media Mentions and Aggregation</title>
<desc id="desc">Social post stream — post id + event time; Stream intake — deduplicate + access policy; Raw posts + model version — retention + corrections; Bounded inference queue — rate + backpressure; Sentiment classifier — abstain + schema checks; Windowed sentiment view — confidence + sampling bias. Do not confuse classifier accuracy with population sentiment; deletions, duplicate posts and sampling affect aggregates.</desc>
