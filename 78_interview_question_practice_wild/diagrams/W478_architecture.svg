<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W478 · Design Object Storage / File Sync (Dropbox / S3)</title>
<desc id="desc">User file edit — file id + base revision; File metadata API — auth + conflict policy; Versioned manifest — directory + permissions; Chunk upload and changes — resumable cursor; Sync workers — verify bytes + reconcile; Device file tree — conflict copy + updates. Stable file identity and version conflicts matter; a filename alone cannot distinguish rename, overwrite and concurrent edit.</desc>
