<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="310" viewBox="0 0 1320 310" role="img" aria-labelledby="title desc">
<title id="title">W487 solution flow</title><desc id="desc">Validate + request identity → Transactional code uniqueness → Cache version / absolute expiry → 302 / 404 / 410 + events. Idempotent creation,forced collisions and concurrent aliases have executable tests.</desc>
