<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W513 · Frontend System Design: Signup Form with A/B Testing</title>
<desc id="desc">Browser form — validation + experiment unit; Signup API — rate limit + checks; Account + assignment store — uniqueness + exposure; Verification workflow — bounded retries; Identity or email provider — reconcile status; Verified account state — accessible error feedback. Keep account uniqueness and verification on the server; experiment assignment must not bypass authentication checks.</desc>
