<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W423 · Design an Audit Logs Service</title>
<desc id="desc">Application events — timestamp + stable id; Log collector — schema + redaction; Durable log storage — retention + indexes; Buffered ingest stream — partitions + backpressure; Indexing and aggregation — late-data policy; Search + dashboards — access-controlled queries. Define what acknowledgment makes durable and what can be lost; redact sensitive fields before broad indexing.</desc>
