<svg xmlns="http://www.w3.org/2000/svg" width="834" height="462" viewBox="0 0 834 462" role="img" aria-labelledby="title desc">
<title id="title">W065. Video Recommendation — architecture</title>
<desc id="desc">App → recommendation API → parallel candidate sources
                              ANN / subscriptions / recent / trending
                                          ↓
                                eligibility + dedup
                                          ↓
                           batched ranker → slate reranker → app
                                          ↓
App impressions / playback → event gateway → event bus
                                              ↙           ↘
                                stream aggregates       raw data lake
                                      ↓                     ↓
                                online features    point-in-time joins
                                                            ↓
                            ANN index + model registry ← training/eval
</desc>
