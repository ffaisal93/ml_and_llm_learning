<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W289 · Design a Release Deployment Workflow with Staged Rollout</title>
<desc id="desc">Model or config release — immutable bundle; Release controller — compatibility checks; Artifact and routing store — version + rollback target; Shadow and canary — bounded traffic; Health + quality gates — compare valid cohorts; Promote or rollback — previous bundle ready. Rollback preprocessing, features and thresholds with the weights; HTTP health alone is not model quality.</desc>
