<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-labelledby="title desc">
<title id="title">W510. Front-end Large Scale Data Rendering with React — architecture</title>
<desc id="desc">Search input → debounce → query/sort/page state → cancellable page request
                                                    ↓ latest generation only
                                           {items, total, version}
                                                    ↓
                           fixed-height virtual viewport → visible rows
</desc>
<rect width="900" height="210" rx="14" fill="#101c30"/>
<text x="32" y="40" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">Search input → debounce → query/sort/page state → cancellable page request</text>
<text x="32" y="68" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                                    ↓ latest generation only</text>
<text x="32" y="96" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                           {items, total, version}</text>
<text x="32" y="124" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                                    ↓</text>
<text x="32" y="152" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                           fixed-height virtual viewport → visible rows</text>
