<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc">
<title id="title">W254 · Implement a Leader-Follower Distributed System with Membership, Failover Detection, and Leader Election (Practical pair-programming)</title>
<desc id="desc">Client write — request id + consistency; Leader — term + ownership; Replicated log — durable committed prefix; Replication messages — acknowledgments; Follower and election — quorum + fencing; Committed response — safe failover. Failure suspicion is not exclusive leadership; terms, quorums and fencing prevent stale writers.</desc>
