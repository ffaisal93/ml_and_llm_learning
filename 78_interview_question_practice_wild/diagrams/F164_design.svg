<polyline points="938,370 938,244" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="950" y="317" font-size="15" font-weight="400" text-anchor="start">state</text>
<polyline points="938,474 938,535 182,535 182,474" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="32" y="140" width="300" height="104" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="182" y="186" font-size="18" font-weight="700" text-anchor="middle">Sender or recipient</text>
<text x="182" y="210" font-size="16" font-weight="400" text-anchor="middle">unguessable capability</text>
<rect x="410" y="140" width="300" height="104" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="560" y="186" font-size="18" font-weight="700" text-anchor="middle">Secret service</text>
<text x="560" y="210" font-size="16" font-weight="400" text-anchor="middle">hash token + authenticate</text>
<rect x="788" y="140" width="300" height="104" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
<text x="938" y="186" font-size="18" font-weight="700" text-anchor="middle">Encrypted secret record</text>
<text x="938" y="210" font-size="16" font-weight="400" text-anchor="middle">expiry + consumed state</text>
<rect x="410" y="370" width="300" height="104" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="560" y="416" font-size="18" font-weight="700" text-anchor="middle">Atomic consume operation</text>
<text x="560" y="440" font-size="16" font-weight="400" text-anchor="middle">one successful claim</text>
<rect x="788" y="370" width="300" height="104" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
<text x="938" y="416" font-size="18" font-weight="700" text-anchor="middle">Decrypt and return once</text>
<text x="938" y="440" font-size="16" font-weight="400" text-anchor="middle">avoid plaintext logging</text>
<rect x="32" y="370" width="300" height="104" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
<text x="182" y="416" font-size="18" font-weight="700" text-anchor="middle">Deleted or consumed result</text>
<text x="182" y="440" font-size="16" font-weight="400" text-anchor="middle">clear expired state</text>
<text x="32" y="590" font-size="18" font-weight="700" text-anchor="start">Key constraint</text>
<text x="32" y="620" font-size="17" font-weight="400" text-anchor="start">The database atomically consumes the secret; a read followed by delete can allow two readers.</text>
