<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W535 · Low-Latency Trading System Design</title>
<desc id="desc">Client order — account + order id; Order gateway — validate + deduplicate; Order and risk state — positions + reservations; Sequenced execution path — deadline + limits; Exchange adapter — acknowledge + reconcile; Order/fill events — audit + client status. Accepted, sent, filled and canceled are different states; reconcile unknown exchange outcomes before retrying exposure.</desc>
