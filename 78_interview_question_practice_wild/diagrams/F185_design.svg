<text x="32" y="37" font-size="25" font-weight="700" text-anchor="start">F185 · Rank news without rewarding stale or misleading content.</text>
<text x="32" y="104" font-size="16" font-weight="400" text-anchor="start">Logical components: boxes may share a process. Arrows show requests, work or state access.</text>
