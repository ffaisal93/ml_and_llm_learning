<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">F185 · Rank news without rewarding stale or misleading content.</title>
<desc id="desc">Publisher or crawler — article + canonical URL; Content ingestion — normalize + deduplicate; Article and topic indexes — freshness + versions; Classification and ranking — permissions + policy; Feed or search assembly — diversity + pagination; Reader results — feedback + provenance. Deduplicate syndicated content and record freshness; a cache hit must not bypass current access restrictions.</desc>
