<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="310" viewBox="0 0 1320 310" role="img" aria-labelledby="title desc">
<title id="title">W474 solution flow</title><desc id="desc">Stage immutable replica bytes → Verify + CAS publish index → GET exact version/checksum → Tombstone / reconcile GC. Bytes precede metadata publication; orphan cleanup never serves an unverified version.</desc>
