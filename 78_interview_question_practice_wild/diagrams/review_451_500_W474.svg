<text x="24" y="38" font-family="Arial,sans-serif" font-size="24" fill="#0f172a">W474 · Solution flow</text>
<path d="M309 139H345" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="90" width="285" height="98" rx="10" fill="#eff6ff" stroke="#2563eb"/>
<text x="166" y="126" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">Stage immutable replica</text>
<text x="166" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">bytes</text>
<path d="M634 139H670" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="349" y="90" width="285" height="98" rx="10" fill="#eff6ff" stroke="#2563eb"/>
<text x="491" y="126" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">Verify + CAS publish index</text>
<path d="M959 139H995" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="674" y="90" width="285" height="98" rx="10" fill="#eff6ff" stroke="#2563eb"/>
<text x="816" y="126" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">GET exact version/checksum</text>
<rect x="999" y="90" width="285" height="98" rx="10" fill="#eff6ff" stroke="#2563eb"/>
<text x="1141" y="126" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">Tombstone / reconcile GC</text>
<text x="24" y="239" font-family="Arial,sans-serif" font-size="17" fill="#334155">Bytes precede metadata publication; orphan cleanup never serves an unverified version.</text>
