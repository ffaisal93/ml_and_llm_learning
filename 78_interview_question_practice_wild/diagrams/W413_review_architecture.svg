<svg xmlns="http://www.w3.org/2000/svg" width="720" height="322" viewBox="0 0 720 322" role="img" aria-labelledby="title desc">
<title id="title">W413. Design Ticket Booking (Ticketmaster) — architecture</title>
<desc id="desc">Browse/search CDN → event seat-map snapshot/deltas
                              ↓
                    waiting room / admission
                              ↓
                  atomic multi-seat hold transaction
                              ↓
                 protected payment attempt → reconciliation
                              ↓
                    sold seats + issued ticket events
</desc>
<rect width="720" height="322" rx="14" fill="#101c30"/>
<text x="32" y="40" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">Browse/search CDN → event seat-map snapshot/deltas</text>
<text x="32" y="68" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                              ↓</text>
<text x="32" y="96" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                    waiting room / admission</text>
<text x="32" y="124" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                              ↓</text>
<text x="32" y="152" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                  atomic multi-seat hold transaction</text>
<text x="32" y="180" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                              ↓</text>
<text x="32" y="208" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                 protected payment attempt → reconciliation</text>
<text x="32" y="236" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                              ↓</text>
<text x="32" y="264" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                    sold seats + issued ticket events</text>
</svg>
