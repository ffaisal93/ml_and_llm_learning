<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W420 · Waitlist System Design</title>
<desc id="desc">Join or cancel request — customer + resource; Waitlist service — eligibility + ordering; Durable membership — positions + states; Expiring offers — bounded retries; Atomic claim and advance — one accepted offer; Confirmed allocation — status + notifications. Offer expiry and acceptance race on authoritative state; a notification is not proof of resource ownership.</desc>
