<svg xmlns="http://www.w3.org/2000/svg" width="856" height="266" viewBox="0 0 856 266" role="img" aria-labelledby="title desc">
<title id="title">W512. Frontend System Design: Infinite-Scroll Image Feed — architecture</title>
<desc id="desc">Scroll sentinel → IntersectionObserver → guarded page loader → fixed API
                                                ↓
                                      merge/deduplicate by ID
                                         ↓              ↓
                                   image grid     IndexedDB metadata
                                         ↓              ↑ offline reload
                                 browser image cache / service worker
</desc>
