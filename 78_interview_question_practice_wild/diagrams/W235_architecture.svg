<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W235 · Design and Implement a Rate Limiter</title>
<desc id="desc">API request — tenant + operation cost; Admission service — resolve current policy; Atomic limiter state — tokens, window or budget; Allowed work path — bounded downstream queue; API executor — timeout + retry rules; Response or throttling — retry guidance + metrics. Consume the correct tenant budget atomically; distinguish rate limits, concurrency limits and monthly quotas.</desc>
