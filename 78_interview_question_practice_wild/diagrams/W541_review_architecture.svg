<svg xmlns="http://www.w3.org/2000/svg" width="845" height="210" viewBox="0 0 845 210" role="img" aria-labelledby="title desc">
<title id="title">W541. Concurrent User Management System Architecture Design — architecture</title>
<desc id="desc">Client → load balancer → authenticated user API → transactional user DB
                                 ↓                       ↓ outbox/CDC
