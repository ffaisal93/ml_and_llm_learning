<svg xmlns="http://www.w3.org/2000/svg" width="900" height="322" viewBox="0 0 900 322" role="img" aria-labelledby="title desc">
<title id="title">W403. Ride-Hailing System Design (Uber) — architecture</title>
<desc id="desc">Driver GPS → location ingestion → latest-by-driver / stream coalescer
                                         ↓                ↓
                                  city geo index     sampled durable history
                                         ↓
Rider request → dispatch candidates → authoritative driver/trip reservation
                                         ↓
                                  offer / accept / trip events
                                         ↓
                                   update eligibility/index
</desc>
