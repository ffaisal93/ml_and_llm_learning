<title id="title">W420. Waitlist System Design — architecture</title>
<desc id="desc">Join/leave API → durable waitlist table + version
                                 ↓
Availability events → listing-key matcher → eligible priority-ordered tasks
                                               ↓
                                  notification outbox/queue workers
                                               ↓
                                      email/push/in-app provider
                                               ↓
                                  dedup delivery status / unsubscribe check
</desc>
