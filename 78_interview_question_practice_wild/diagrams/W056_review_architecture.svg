<svg xmlns="http://www.w3.org/2000/svg" width="801" height="378" viewBox="0 0 801 378" role="img" aria-labelledby="title desc">
<title id="title">W056. ML Model Design — Prompt-to-Design Generation — architecture</title>
<desc id="desc">Consented briefs + approved page bundles → clean / split / augment
                                                    ↓
                                      supervised model training
                                                    ↓
                                  preference tuning + held-out eval
                                                    ↓
Prompt → generator → parse / sandbox render / accessibility checks
                          ↓ failed             ↓ passed
                     bounded repair       preview + editable files
                                               ↓
                                    reviewed feedback → new dataset
</desc>
