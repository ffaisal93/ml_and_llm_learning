<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W434 · Real-Time Collaborative Code Editor</title>
<desc id="desc">Editing client — operation id + base version; Collaboration gateway — auth + room; Durable operation log — snapshots + document version; Ordered or CRDT sync — deduplicate operations; Merge and broadcast — conflict semantics; Converged client document — reconnect replay. Choose and explain OT or CRDT semantics; presence updates cannot substitute for a durable edit history.</desc>
