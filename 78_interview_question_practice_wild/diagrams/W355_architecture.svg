<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W355 · Near-Real-Time Friend-Played-Game Counter</title>
<desc id="desc">Like or unlike — user + object id; Mutation service — idempotent operation; Canonical relationship store — unique user-object edge; Change-event stream — deduplicate + replay; Count materialization — versions + reconciliation; Count query — freshness + read-your-write hint. Store the underlying relationship or operation authority; retrying a like must not increment the count twice.</desc>
