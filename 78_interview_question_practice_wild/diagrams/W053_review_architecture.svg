<svg xmlns="http://www.w3.org/2000/svg" width="735" height="378" viewBox="0 0 735 378" role="img" aria-labelledby="title desc">
<title id="title">W053. Design an LLM-Agent System for Automation (Ticket Triage / Code Review) — architecture</title>
<desc id="desc">Ticket created → durable job/outbox → triage worker
                                      ↓
                     fetch authorized ticket + account facts
                                      ↓
                       classifier / bounded LLM proposal
                                      ↓
                    schema + routing-policy validator
                         ↓                       ↓
                 atomic route update       human triage queue
                         ↓                       ↓
                     audit record ← decision and correction
</desc>
<rect width="735" height="378" rx="14" fill="#101c30"/>
<text x="32" y="40" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">Ticket created → durable job/outbox → triage worker</text>
<text x="32" y="68" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                      ↓</text>
<text x="32" y="96" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                     fetch authorized ticket + account facts</text>
<text x="32" y="124" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                      ↓</text>
<text x="32" y="152" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                       classifier / bounded LLM proposal</text>
<text x="32" y="180" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                      ↓</text>
<text x="32" y="208" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                    schema + routing-policy validator</text>
<text x="32" y="236" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                         ↓                       ↓</text>
<text x="32" y="264" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                 atomic route update       human triage queue</text>
<text x="32" y="292" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                         ↓                       ↓</text>
<text x="32" y="320" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                     audit record ← decision and correction</text>
</svg>
