<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W421 · Core Dump Collection System Design</title>
<desc id="desc">Crashed application — crash id + manifest; Upload admission — consent + size limits; Encrypted artifact store — retention + access policy; Crash processing queue — deduplication; Symbolication worker — matching build symbols; Diagnostic index — restricted query + deletion. Core dumps may contain sensitive memory; isolate access and match the exact binary/symbol version.</desc>
