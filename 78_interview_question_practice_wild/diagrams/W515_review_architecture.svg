<svg xmlns="http://www.w3.org/2000/svg" width="779" height="378" viewBox="0 0 779 378" role="img" aria-labelledby="title desc">
<title id="title">W515. Design a Real-Time Multiplayer Game Backend — architecture</title>
<desc id="desc">Client → nearest healthy region / auth → matchmaking queues
                                             ↓
                                     match + server allocator
                                             ↓
Client input / snapshots ↔ authoritative match owner (20 Hz)
                                             ↓
                             durable checkpoints / result outbox
                                             ↓
                                account/progress result service
                                             ↓
                              home-account DB → regional replicas
</desc>
