<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W034 · Distributed LLM Training Data Pipeline</title>
<desc id="desc">Training experiment — code + data + config; Run controller — gang placement; Run and model registry — immutable versions; Resource scheduler — GPU topology; Training worker group — collectives + checkpoints; Checkpoint store — metrics + artifacts. Resume from compatible durable checkpoints; failed ranks must not silently create a different experiment.</desc>
