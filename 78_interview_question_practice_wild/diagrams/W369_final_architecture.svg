<svg xmlns="http://www.w3.org/2000/svg" width="845" height="327" viewBox="0 0 845 327" role="img" aria-labelledby="title desc">
<title id="title">Pluggable ordered-event simulation</title>
<desc id="desc">Initial state + ordered event list + chosen rule contract
                           ↓
                 validate / deduplicate event identity
                           ↓
                 transition(state, event) → new state + outcome
                           ↓
                 ordered trace / checkpoint / final result

Scale: independent entity partitions → ordered workers → durable replay</desc>
<rect width="845" height="327" rx="14" fill="#101c30"/>
<text x="32" y="42" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">Initial state + ordered event list + chosen rule contract</text>
<text x="32" y="70" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                           ↓</text>
<text x="32" y="98" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                 validate / deduplicate event identity</text>
<text x="32" y="126" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                           ↓</text>
<text x="32" y="154" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                 transition(state, event) → new state + outcome</text>
<text x="32" y="182" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                           ↓</text>
<text x="32" y="210" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                 ordered trace / checkpoint / final result</text>
<text x="32" y="238" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17"></text>
<text x="32" y="266" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">Scale: independent entity partitions → ordered workers → durable replay</text>
</svg>
