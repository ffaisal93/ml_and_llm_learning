<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="310" viewBox="0 0 1320 310" role="img" aria-labelledby="title desc">
<title id="title">W247 solution flow</title><desc id="desc">get(key) under mutex → Hit or claim in-flight → Compute outside mutex → Publish + notify waiters. Same-key waiters loop on the condition; different keys compute concurrently.</desc>
