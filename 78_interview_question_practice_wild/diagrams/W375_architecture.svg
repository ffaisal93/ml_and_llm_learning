<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W375 · Design a Feature Flag System</title>
<desc id="desc">Operator change — config generation; Configuration service — validate + approve; Versioned config store — prior rollback version; Distribution stream — snapshot + deltas; Local SDK evaluation — deterministic bucketing; Application behavior — freshness + exposure logs. Version every update and keep a safe fallback; eventual delivery alone does not establish current configuration.</desc>
