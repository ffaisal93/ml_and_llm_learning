<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title description">
<title id="title">Successful shopping-cart checkout sequence</title><desc id="description">The shopper submits checkout with an idempotency key. Checkout validates a snapshot, atomically reserves stock and creates an order, marks payment pending before contacting the external provider, captures payment using the stable order ID, then atomically commits inventory, confirms the order and writes an outbox event. An unknown payment result stays pending for reconciliation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<rect width="1080" height="1080" rx="16" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#0f172a">
<text x="25" y="36" font-size="27" font-weight="700" text-anchor="start" fill="#0f172a">W408 · Checkout in six steps</text>
<text x="25" y="64" font-size="17" font-weight="400" text-anchor="start" fill="#475569">Successful path. Prices are revalidated before step 2; retries reuse the same order ID.</text>
<line x1="105" y1="145" x2="105" y2="890" stroke="#94a3b8" stroke-dasharray="6 7" stroke-width="2"/>
<line x1="345" y1="145" x2="345" y2="890" stroke="#94a3b8" stroke-dasharray="6 7" stroke-width="2"/>
<line x1="660" y1="145" x2="660" y2="890" stroke="#94a3b8" stroke-dasharray="6 7" stroke-width="2"/>
<line x1="955" y1="145" x2="955" y2="890" stroke="#94a3b8" stroke-dasharray="6 7" stroke-width="2"/>
<rect x="30.0" y="90" width="150" height="60" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="105.0" y="126.0" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">Shopper</text>
<rect x="255.0" y="90" width="180" height="60" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="345.0" y="126.0" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">Checkout</text>
<rect x="540.0" y="90" width="240" height="60" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
<text x="660.0" y="114.0" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">Order / Inventory</text>
<text x="660.0" y="138.0" font-size="16" font-weight="400" text-anchor="middle" fill="#0f172a">+ Commerce SQL</text>
<rect x="860.0" y="90" width="190" height="60" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="955.0" y="126.0" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">Payment provider</text>
<polyline points="105,205 345,205" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="0" marker-end="url(#arrow)"/>
<text x="225.0" y="191" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">1 · Checkout + retry key</text>
<text x="363" y="248" font-size="16" font-weight="400" text-anchor="start" fill="#0f172a">Validate cart snapshot and current price.</text>
<polyline points="345,310 660,310" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="0" marker-end="url(#arrow)"/>
<text x="502.5" y="296" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">2 · Reserve units + create order</text>
<polyline points="660,365 345,365" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="8" marker-end="url(#arrow)"/>
<text x="502.5" y="351" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">Order O123 · RESERVED</text>
<polyline points="345,440 660,440" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="0" marker-end="url(#arrow)"/>
<text x="502.5" y="426" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">3 · Mark PAYMENT_PENDING</text>
<text x="363" y="481" font-size="16" font-weight="400" text-anchor="start" fill="#0f172a">Expiry worker cannot release this hold now.</text>
<polyline points="345,545 955,545" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="0" marker-end="url(#arrow)"/>
<text x="650.0" y="531" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">4 · Capture payment once · key = O123</text>
<polyline points="955,605 345,605" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="8" marker-end="url(#arrow)"/>
<text x="650.0" y="591" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">Payment captured</text>
<polyline points="345,695 660,695" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="0" marker-end="url(#arrow)"/>
<text x="502.5" y="681" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">5 · Commit stock + confirm + outbox</text>
<polyline points="660,755 345,755" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="8" marker-end="url(#arrow)"/>
<text x="502.5" y="741" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">O123 · CONFIRMED (durable)</text>
<polyline points="345,835 105,835" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="8" marker-end="url(#arrow)"/>
<text x="225.0" y="821" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">6 · Return order O123</text>
<rect x="455" y="863" width="590" height="80" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
<text x="750.0" y="897.0" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">After the SQL commit</text>
<text x="750.0" y="921.0" font-size="16" font-weight="400" text-anchor="middle" fill="#0f172a">Publish OrderConfirmed → receipt, fulfillment and cart cleanup</text>
<rect x="25" y="972" width="1020" height="78" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/>
<text x="535.0" y="1005.0" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">If payment result is unknown: keep the order pending and query the provider.</text>
<text x="535.0" y="1029.0" font-size="16" font-weight="400" text-anchor="middle" fill="#0f172a">Do not free its stock or create another payment while the outcome is unresolved.</text>
</g></svg>
