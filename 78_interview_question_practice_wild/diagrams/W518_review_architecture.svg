<svg xmlns="http://www.w3.org/2000/svg" width="900" height="322" viewBox="0 0 900 322" role="img" aria-labelledby="title desc">
<title id="title">W518. System Design: Chess Game — architecture</title>
<desc id="desc">Players ↔ websocket gateways → game-ID router → authoritative chess owner
                  ↓                                  ↓
             rating queue                   rule engine + server clocks
                  ↓                                  ↓
               matcher                       ordered durable move log
                                                     ↓
                              Redis live snapshot / history DB / PGN archive
                                                     ↓
                                        result + rating outbox jobs
</desc>
