<text x="938" y="210" font-size="16" font-weight="400" text-anchor="middle">immutable input reference</text>
<rect x="410" y="370" width="300" height="104" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="560" y="416" font-size="18" font-weight="700" text-anchor="middle">Partition task queue</text>
<text x="560" y="440" font-size="16" font-weight="400" text-anchor="middle">lease + bounded retry</text>
<rect x="788" y="370" width="300" height="104" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
