<text x="32" y="620" font-size="17" font-weight="400" text-anchor="start">Rerun the same input partition without double-counting; publish only verified output and checkpoint after</text>
<text x="32" y="645" font-size="17" font-weight="400" text-anchor="start">durable commit.</text>
