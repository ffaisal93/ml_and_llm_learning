<polyline points="938,474 938,535 182,535 182,474" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="32" y="140" width="300" height="104" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="182" y="186" font-size="18" font-weight="700" text-anchor="middle">Input snapshot</text>
<text x="182" y="210" font-size="16" font-weight="400" text-anchor="middle">partition + data version</text>
<rect x="410" y="140" width="300" height="104" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="560" y="186" font-size="18" font-weight="700" text-anchor="middle">Run coordinator</text>
<text x="560" y="210" font-size="16" font-weight="400" text-anchor="middle">stable work identity</text>
