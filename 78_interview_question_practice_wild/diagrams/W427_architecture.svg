<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc">
<title id="title">W427 · Build a Discord-like TCP Chat Server with Slash Commands, Rooms, Reconnection, and Persistence</title>
<desc id="desc">Chat client — user + message id; Connection gateway — membership + routing; Durable message log — per-conversation sequence; Delivery stream — retry + fan-out; Session and offline delivery — cursor + deduplication; Recipient view — acknowledgments + reconnect. Acknowledge under a stated durability guarantee; reconnect from a cursor and enforce conversation membership.</desc>
