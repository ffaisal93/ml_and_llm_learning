<svg xmlns="http://www.w3.org/2000/svg" width="720" height="266" viewBox="0 0 720 266" role="img" aria-labelledby="title desc">
<title id="title">W509. Design a Website for 100,000 Concurrent Users with Live Comments — architecture</title>
<desc id="desc">Browser → CDN (static assets)
   ↓ POST comment                    ↑ live events / replay
Load balancer → stateless comment API    realtime gateways
                          ↓                  ↑
                  comments DB + outbox → room event bus
                          ↓                  ↓
                    recent-history cache    fan-out workers
</desc>
