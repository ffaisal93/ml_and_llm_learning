<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W042 · RAG Notebook (ML Coding)</title>
<desc id="desc">DataFrame text + query — explicit id/text columns; Batch encoder + query — shared embedding version; Document embedding index — row ids + normalized vectors; Cosine top-10 retrieval — stable score ordering; Retrieval evaluator — gold relevant document ids; Recall + reciprocal rank — explicit fixture results. Use one embedding contract and preserve source-row identity; evaluate against relevance labels.</desc>
