<svg xmlns="http://www.w3.org/2000/svg" width="856" height="266" viewBox="0 0 856 266" role="img" aria-labelledby="title desc">
<title id="title">W534. Low-Latency Trading System Design — architecture</title>
<desc id="desc">Remote office: trader UI / configuration / monitoring
                   ↕ diverse authenticated WAN links
Colocation: control gateway → risk / strategy / order gateway ↔ exchange
                                   ↑                            ↓
                              local feed handler ← market data
                                   ↓
                         durable audit / remote replication
</desc>
