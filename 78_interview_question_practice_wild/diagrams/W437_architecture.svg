<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W437 · Credit Card Service with Points Earning and Redemption System</title>
<desc id="desc">Money operation — account + idempotency key; Ledger API — validate + authorize; Immutable entries + balances — transaction + uniqueness; Atomic posting transaction — balanced entries; Reconciliation and outbox — external evidence; Auditable balance — statements + delivery. Money movement is governed by balanced atomic ledger entries; a mutable cached balance is not the audit authority.</desc>
