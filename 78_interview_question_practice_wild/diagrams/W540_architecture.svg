<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W540 · Coffee Ordering System Design</title>
<desc id="desc">Customer selection — item + quantity; Ordering API — price + validate + retry key; Order and catalog store — lifecycle + availability; Preparation work queue — versioned ticket; Fulfillment worker — claim + state transitions; Order status — ready, delivered or canceled. One accepted order has one stable identity; retries and concurrent preparation claims must not duplicate fulfillment.</desc>
