<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W401 · Perishable-Goods Tracking &amp; Location System</title>
<desc id="desc">Shipment telemetry — location + temperature + time; Tracking ingestion — authenticate + deduplicate; Current and historical state — shipment + sensor versions; Spatial and threshold rules — late or missing readings; Route or spoilage alerts — stateful threshold evaluation; Shipment status — freshness + investigation. Do not overwrite a newer observation with an old one; distinguish measured temperature, missing data and inferred spoilage risk.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#475569"/></marker></defs>
<rect width="1120" height="770" rx="16" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#0f172a">
<text x="32" y="37" font-size="25" font-weight="700" text-anchor="start">W401 · Perishable-Goods Tracking &amp; Location System</text>
<text x="32" y="104" font-size="16" font-weight="400" text-anchor="start">Logical components: boxes may share a process. Arrows show requests, work or state access.</text>
<polyline points="332,192 410,192" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<polyline points="710,192 788,192" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<polyline points="560,244 560,370" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="573" y="316" font-size="15" font-weight="400" text-anchor="start">work path</text>
