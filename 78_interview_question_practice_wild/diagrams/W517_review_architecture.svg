<svg xmlns="http://www.w3.org/2000/svg" width="878" height="322" viewBox="0 0 878 322" role="img" aria-labelledby="title desc">
<title id="title">W517. Minesweeper Game Design (OOD) — architecture</title>
<desc id="desc">Player command → game API / ownership + expected-version check
                                ↓
                     Minesweeper rule object
                                ↓
                    private snapshot + command log
                                ↓
                       durable game storage
                         ↓              ↓
                   safe state view   verified finished score → leaderboard
</desc>
<rect width="878" height="322" rx="14" fill="#101c30"/>
<text x="32" y="40" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">Player command → game API / ownership + expected-version check</text>
<text x="32" y="68" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                ↓</text>
<text x="32" y="96" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                     Minesweeper rule object</text>
<text x="32" y="124" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                ↓</text>
<text x="32" y="152" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                    private snapshot + command log</text>
<text x="32" y="180" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                ↓</text>
<text x="32" y="208" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                       durable game storage</text>
<text x="32" y="236" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                         ↓              ↓</text>
<text x="32" y="264" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                   safe state view   verified finished score → leaderboard</text>
</svg>
