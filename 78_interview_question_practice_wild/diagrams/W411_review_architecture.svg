<title id="title">W411. Design an Expedia-Style Hotel Reservation System — architecture</title>
<desc id="desc">Provider feeds / polling → normalized offer cache → search API
                                      ↓ selected offer
                               booking coordinator
                              ↙                   ↘
                  exclusive allotment DB     provider hold/confirm API
                              ↘                   ↙
                           durable reservation + reconciliation
</desc>
