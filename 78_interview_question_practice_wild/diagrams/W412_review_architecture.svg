<svg xmlns="http://www.w3.org/2000/svg" width="834" height="294" viewBox="0 0 834 294" role="img" aria-labelledby="title desc">
<title id="title">W412. Design an Online Auction System with Concurrent Bidding — architecture</title>
<desc id="desc">Bidder REST request → auth/rate limit → auction-key ordered worker
                                               ↓
                               bid history + highest state + outbox
                                               ↓
                                realtime fan-out / current-price cache
                                               ↓
                                          bidders/watchers
Timer → ordered close command → winner/result outbox → settlement
</desc>
<rect width="834" height="294" rx="14" fill="#101c30"/>
<text x="32" y="40" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">Bidder REST request → auth/rate limit → auction-key ordered worker</text>
<text x="32" y="68" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                               ↓</text>
<text x="32" y="96" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                               bid history + highest state + outbox</text>
<text x="32" y="124" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                               ↓</text>
<text x="32" y="152" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                realtime fan-out / current-price cache</text>
<text x="32" y="180" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                               ↓</text>
<text x="32" y="208" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                          bidders/watchers</text>
<text x="32" y="236" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">Timer → ordered close command → winner/result outbox → settlement</text>
