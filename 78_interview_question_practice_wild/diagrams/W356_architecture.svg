<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W356 · Real-time status counting system design</title>
<desc id="desc">Entity state event — entity id + version; Event intake — deduplicate + order check; Latest entity state — authoritative version; State transition stream — old group to new group; Count projection — idempotent delta + reconcile; Group status counts — freshness + rebuild path. Count state transitions rather than raw messages; duplicates and out-of-order events must not inflate totals.</desc>
