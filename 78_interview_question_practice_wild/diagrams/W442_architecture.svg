<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W442 · Design a Loan Payment Distribution System</title>
<desc id="desc">Payment receipt — loan + operation id; Allocation service — contractual ordering; Loan ledger — principal + interest + fees; Atomic allocation plan — rounding + limits; Posting and reconciliation — correction entries; Loan statement — remaining balances. Use explicit allocation and rounding rules; the posted components must sum to the accepted payment amount.</desc>
