<svg xmlns="http://www.w3.org/2000/svg" width="922" height="294" viewBox="0 0 922 294" role="img" aria-labelledby="title desc">
<title id="title">W401. Perishable-Goods Tracking &amp; Location System — architecture</title>
<desc id="desc">Scanner / store system → movement API → unit snapshot + movement ledger/outbox
                                               ↓
                         expiry-time index → due-window queue → expiry worker
                                               ↓
                                     relocation task to store staff
                                               ↓
                              scan-confirmed move → current-location view
Query → product-location API → versioned cache / authoritative DB
</desc>
