<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W307 · Design a Credit-Approval Risk Engine</title>
<desc id="desc">Credit application — stable submission id; Application intake — validate + deduplicate; Application decision state — provider references; Bounded provider fan-out — bureau, identity, income; Decision coordinator — score + rules + review; Async decision status — audit + adverse outcomes. Return a stable application id before slow checks finish; each provider operation and final decision is tracked idempotently.</desc>
