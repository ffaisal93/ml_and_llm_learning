<desc id="desc">Ad request — placement + user context; Eligible-ad retrieval — targeting + consent; Campaign and feature store — bids + budget state; Candidate scoring — CTR + value estimates; Auction and policy — pacing + frequency limits; Ad impression — spend + outcome logs. A high predicted score does not override budget, policy, pacing or frequency constraints.</desc>
