<svg xmlns="http://www.w3.org/2000/svg" width="867" height="378" viewBox="0 0 867 378" role="img" aria-labelledby="title desc">
<title id="title">W063. ML System Design: Search &amp; Ranking — architecture</title>
<desc id="desc">Query → normalize / language / query embedding
                       ↓
            lexical index + ANN embedding index ← offline item embeddings
                       ↓
               merge / deduplicate / filter
                       ↓
          batched personalized ranker ← online user features
                       ↓
             diversity / policy → results
                       ↓
          impressions + outcomes → training / evaluation
</desc>
