<svg xmlns="http://www.w3.org/2000/svg" width="889" height="266" viewBox="0 0 889 266" role="img" aria-labelledby="title desc">
<title id="title">W533. Low-Latency Multi-Exchange Buy/Sell System Design — architecture</title>
<desc id="desc">Venue price streams → normalized fresh quote/depth cache
                                         ↓
Immediate API → durable intent/outbox → execution router → venue adapters
                                         ↑                    ↓
Schedule DB → due-time dispatcher → unique occurrence      execution events
                                         ↓                    ↓
                               balance reservation ← ledger/reconciler
</desc>
