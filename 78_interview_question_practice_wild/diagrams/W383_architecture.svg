<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W383 · Design a Distributed Web Crawler</title>
<desc id="desc">Seed URLs — crawl scope; URL frontier — normalize + deduplicate; Seen URL and crawl state — fetch history; Host-aware scheduler — robots + rate limits; Fetch and parse workers — bounded bytes + retries; Content and discovered URLs — indexed crawl results. Bound per-host load and total fan-out; cycles, duplicate URLs and failed fetches must not grow the crawl forever.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#475569"/></marker></defs>
