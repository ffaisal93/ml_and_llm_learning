<svg xmlns="http://www.w3.org/2000/svg" width="999" height="327" viewBox="0 0 999 327" role="img" aria-labelledby="title desc">
<title id="title">Raw search, entity rollups and mention notifications</title>
<desc id="desc">Posts / news → durable ingestion log → normalized raw corpus → full-text search index
                         ↓
                entity/ticker extraction + deduplication
                         ↓
                entity + event-time window rollups → chart/time-series API
                         ↓
                subscription rule evaluation → notification outbox
                         ↓
                    bounded channel workers</desc>
