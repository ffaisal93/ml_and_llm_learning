<text x="32" y="70" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                         ↓</text>
<text x="32" y="98" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                entity/ticker extraction + deduplication</text>
