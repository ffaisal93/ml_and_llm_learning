<text x="32" y="154" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                entity + event-time window rollups → chart/time-series API</text>
<text x="32" y="182" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                         ↓</text>
