<text x="32" y="620" font-size="17" font-weight="400" text-anchor="start">State the write policy and stale-read contract; eviction and failed fills must not create false authoritative</text>
<text x="32" y="645" font-size="17" font-weight="400" text-anchor="start">data.</text>
