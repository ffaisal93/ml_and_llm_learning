<text x="560" y="416" font-size="18" font-weight="700" text-anchor="middle">Miss-fill or invalidation</text>
<text x="560" y="440" font-size="16" font-weight="400" text-anchor="middle">coalesce duplicate work</text>
<rect x="788" y="370" width="300" height="104" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
