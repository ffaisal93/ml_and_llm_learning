<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">F170 · Design a cache without serving incorrect data.</title>
<desc id="desc">Client get or put — key + consistency need; Cache router — shard + request policy; Cache nodes — capacity + replication; Miss-fill or invalidation — coalesce duplicate work; Backing-store adapter — versioned write policy; Cached response — hit, miss + freshness. State the write policy and stale-read contract; eviction and failed fills must not create false authoritative data.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#475569"/></marker></defs>
