<svg xmlns="http://www.w3.org/2000/svg" width="823" height="266" viewBox="0 0 823 266" role="img" aria-labelledby="title desc">
<title id="title">W405. Airbnb Booking System Design — architecture</title>
<desc id="desc">Search → cached geo/date index → candidate listings
                                  ↓ selected listing
Checkout → booking authority → atomic night holds + pending order
                                  ↓ payment-pending transition
                           idempotent payment operation
                                  ↓
                     confirm nights/order + outbox → receipt/calendar
</desc>
<rect width="823" height="266" rx="14" fill="#101c30"/>
<text x="32" y="40" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">Search → cached geo/date index → candidate listings</text>
<text x="32" y="68" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                  ↓ selected listing</text>
<text x="32" y="96" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">Checkout → booking authority → atomic night holds + pending order</text>
<text x="32" y="124" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                  ↓ payment-pending transition</text>
<text x="32" y="152" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                           idempotent payment operation</text>
<text x="32" y="180" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                  ↓</text>
<text x="32" y="208" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                     confirm nights/order + outbox → receipt/calendar</text>
</svg>
