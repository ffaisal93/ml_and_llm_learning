<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W344 · WAL Log Enrichment CDC Pipeline at 1M writes/sec</title>
<desc id="desc">Database commit — transaction + log position; CDC reader — resume offset; Durable change log — schema + retention; Partitioned enrichment — reference-state versions; Idempotent sink writer — checkpoint after persistence; Query or analytics store — replayable results. Persist a sink result before advancing its checkpoint; replay must not double-apply a change.</desc>
