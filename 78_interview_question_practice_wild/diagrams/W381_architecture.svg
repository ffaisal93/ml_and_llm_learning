<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W381 · Book Seller External Fan-Out Broker Service</title>
<desc id="desc">Book query — deadline + request id; Fan-out broker — provider selection; Provider configuration — quotas + health; Bounded parallel calls — individual timeouts; Result merge — normalize + deduplicate; Partial or full response — provider diagnostics. One slow provider must not block every request indefinitely; report partial results under an explicit deadline.</desc>
