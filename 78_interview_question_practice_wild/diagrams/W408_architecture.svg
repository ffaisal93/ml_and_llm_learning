<text x="412" y="250" font-size="16" font-weight="400" text-anchor="start" fill="#0f172a">cart snapshot</text>
<polyline points="425,380 495,380" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="0" marker-end="url(#arrow)"/>
<polyline points="705,380 775,380" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="0" marker-end="url(#arrow)"/>
<polyline points="235,380 115,380 115,520" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="0" marker-end="url(#arrow)"/>
<text x="130" y="450" font-size="16" font-weight="400" text-anchor="start" fill="#0f172a">revalidate</text>
<polyline points="330,430 330,520" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="0" marker-end="url(#arrow)"/>
<text x="345" y="482" font-size="16" font-weight="400" text-anchor="start" fill="#0f172a">pay once</text>
