<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="850" viewBox="0 0 1040 850" role="img" aria-labelledby="title description">
<title id="title">Shopping cart architecture: fast carts and safe checkout</title><desc id="description">A shopper reaches an API gateway. Cart operations use the Cart Service and durable Cart Store. Checkout calls Pricing, Order and Inventory, and the Payment Provider. The Order and Inventory service owns a transactional Commerce SQL store. A durable outbox publishes confirmed-order events to receipt, fulfillment and cart-cleanup workers.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<rect width="1040" height="850" rx="16" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#0f172a">
<text x="25" y="36" font-size="27" font-weight="700" text-anchor="start" fill="#0f172a">W408 · Fast carts, safe checkout</text>
<text x="25" y="62" font-size="16" font-weight="400" text-anchor="start" fill="#475569">Solid arrows: requests or database calls. Dashed arrows: asynchronous events.</text>
