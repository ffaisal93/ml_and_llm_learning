<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W353 · Design a Trending-Hashtags Detection System</title>
<desc id="desc">Timestamped events — object + event id; Stream ingress — deduplicate + partition; Durable event log — replay + retention; Windowed aggregators — event-time + watermark; Merge top-K candidates — approximation + error; Ranked query result — window + freshness. State the time window and approximation; expired events and late arrivals must have a defined correction rule.</desc>
