<title id="title">W069 · Airbnb Experiences — Search Ranking (ML Design)</title>
<desc id="desc">Search query — user + filters; Query service — parse + authorization; Search indexes — text + vectors + versions; Candidate merge — bounded reranking; Ranking and filtering — relevance + availability; Search results — trace + feedback. Enforce access and eligibility before exposing results; index freshness and relevance are different concerns.</desc>
