<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W520 · Design a 3-Day Donation Service</title>
<desc id="desc">Donor submission — campaign + stable key; Donation service — validate + rate limit; Donation and payment state — durable intent + amount; Collection workflow — provider key + retry; Payment + reconciliation — terminal outcome; Receipt and campaign total — deduplicated projection. Count only the defined successful payment state; payment retries must not double-charge or inflate campaign totals.</desc>
