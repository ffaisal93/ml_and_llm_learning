<title id="title">W410 · Design an Event Ticket Marketplace: Seat Holds and On-Sale Traffic</title>
<desc id="desc">Buyer — resource + quantity; Reservation API — validate + idempotency; Inventory and hold state — conditional allocation; Expiring checkout hold — payment handoff; Payment + confirmation — reconcile unknown outcomes; Confirmed booking — receipt + outbox. Only an atomic valid hold owns stock; unresolved payment outcomes cannot be treated as safe release.</desc>
