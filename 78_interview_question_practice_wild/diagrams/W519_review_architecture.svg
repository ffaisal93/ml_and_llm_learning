<svg xmlns="http://www.w3.org/2000/svg" width="746" height="322" viewBox="0 0 746 322" role="img" aria-labelledby="title desc">
<title id="title">W519. Charity Donation System — architecture</title>
<desc id="desc">Browser → donation API → donation DB + outbox
                              ↓
                       bounded payment workers → SDK/provider
                              ↑                      ↓
                       reconciliation ← verified webhook inbox
                              ↓
                        successful donation ledger
                              ↓ outbox
                      receipt worker / donor status API
</desc>
