<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W449 · Subscription Billing System for 300M Subscribers</title>
<desc id="desc">Subscription or invoice tick — customer + billing period; Billing service — versioned price + proration; Subscription and invoice ledger — unique period key; Invoice/payment jobs — due time + retry; Payment collection — reconcile provider result; Invoice + entitlement — notification + audit. One billing period must not be invoiced twice; payment state and product entitlement changes need explicit rules.</desc>
