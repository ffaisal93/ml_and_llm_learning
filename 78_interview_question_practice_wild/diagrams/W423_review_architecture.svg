<svg xmlns="http://www.w3.org/2000/svg" width="911" height="266" viewBox="0 0 911 266" role="img" aria-labelledby="title desc">
<title id="title">W423. Design an Audit Logs Service — architecture</title>
<desc id="desc">Account operation + transactional outbox → durable audit ingestion
                                                    ↓
                                   append-only partitioned event store
                                       ↓                         ↓
                             account/time index             archive/retention
                                       ↓
Authenticated query API → authorized account scope → paginated events
</desc>
