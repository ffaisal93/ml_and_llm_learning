<svg xmlns="http://www.w3.org/2000/svg" width="900" height="378" viewBox="0 0 900 378" role="img" aria-labelledby="title desc">
<title id="title">W066. Homepage Video Recommendation System — architecture</title>
<desc id="desc">TV / mobile client → edge/auth → homepage orchestrator
                                      ↓ parallel bounded calls
                    profile/context   eligibility/catalog   candidate caches
                                      ↓
                           item ranker + row composer
                                      ↓
                          metadata hydration → homepage
                                      ↓
Client impressions / plays → durable events → features/training
                                                   ↓
                      cached candidates + model/index registry
</desc>
