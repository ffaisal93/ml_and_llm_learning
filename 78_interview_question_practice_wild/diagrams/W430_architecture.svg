<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W430 · Design a Collaborative Spreadsheet (Google Sheets)</title>
<desc id="desc">Editor operation — sheet + cell + version; Collaboration service — auth + concurrency; Cells + dependency graph — edit log + snapshots; Ordered edit processing — deduplicate + conflict rules; Formula recalculation — dependency + cycle handling; Live cell updates — history + reconnect replay. Accepted edits, formula dependencies and snapshots must refer to coherent sheet versions; presence is not durable edit state.</desc>
