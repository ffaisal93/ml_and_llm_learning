<svg xmlns="http://www.w3.org/2000/svg" width="790" height="238" viewBox="0 0 790 238" role="img" aria-labelledby="title desc">
<title id="title">W424. Environment-specific Logging Without Code Modifications — architecture</title>
<desc id="desc">Same application binary and logging calls
                    ↓ external configuration path
        deployment config             production config
             root INFO                     root OFF
                ↓                             ↓
       one application.log file       no governed application logs
</desc>
<rect width="790" height="238" rx="14" fill="#101c30"/>
<text x="32" y="40" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">Same application binary and logging calls</text>
<text x="32" y="68" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                    ↓ external configuration path</text>
<text x="32" y="96" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">        deployment config             production config</text>
<text x="32" y="124" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">             root INFO                     root OFF</text>
<text x="32" y="152" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                ↓                             ↓</text>
<text x="32" y="180" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">       one application.log file       no governed application logs</text>
</svg>
