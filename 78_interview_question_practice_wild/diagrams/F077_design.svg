<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">F077 · Design tool schemas and validate LLM outputs.</title>
<desc id="desc">User task — explicit server permissions; Application orchestrator — separate evidence from instructions; Scoped document store — protected resources; Tool authorization gate — schema + capability checks; Restricted execution — no ambient secrets; Validated task outcome — safe refusal + audit. Untrusted retrieved text cannot grant a new tool, permission or destination; enforce these boundaries outside the model.</desc>
