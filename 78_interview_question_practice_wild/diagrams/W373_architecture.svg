<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W373 · Cross-Domain SSO After an Acquisition, and OIDC Across Sites</title>
<desc id="desc">Browser — target application; Identity redirect — state + nonce + PKCE; Identity provider — sessions + registered clients; Code exchange — validate redirect and issuer; Application session — token validation; Scoped application access — logout + expiration. Do not share raw session cookies across unrelated domains; validate issuer, audience, nonce and redirect binding.</desc>
