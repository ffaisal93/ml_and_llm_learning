<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W264 · Designing YouTube</title>
<desc id="desc">Video upload — metadata + owner; Media API — authorize + create manifest; Durable object store — originals + variants; Transcode task queue — retries + versions; Transcode and publish — verify playable outputs; Catalog + playback CDN — access + view events. Publish only verified complete variants; an uploaded object is not yet a playable published video.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#475569"/></marker></defs>
