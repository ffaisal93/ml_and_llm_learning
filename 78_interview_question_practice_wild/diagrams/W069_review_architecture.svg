<svg xmlns="http://www.w3.org/2000/svg" width="720" height="434" viewBox="0 0 720 434" role="img" aria-labelledby="title desc">
<title id="title">W069. Airbnb Experiences — Search Ranking (ML Design) — architecture</title>
<desc id="desc">Retrieved candidates + query/user context
                    ↓
          availability / eligibility check
                    ↓
          bulk static + online feature lookup
                    ↓
         batched booking-probability ranker
                    ↓
         diversity / business constraints → top 100
                    ↓
       logged exposure + delayed booking/cancellation
                    ↓
         time-split daily/weekly training → registry
</desc>
