<svg xmlns="http://www.w3.org/2000/svg" width="922" height="266" viewBox="0 0 922 266" role="img" aria-labelledby="title desc">
<title id="title">W404. Rider-Driver Matching System — architecture</title>
<desc id="desc">GPS → region location service → fresh geo candidate index
                                         ↓
Rider API → ride request store → matcher → driver reservation authority
                                         ↓                  ↓
                                     offer gateway ← accepted/declined/expired
                                         ↓
                             durable trip + events → rider/driver views
</desc>
