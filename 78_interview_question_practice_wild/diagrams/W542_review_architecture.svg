<svg xmlns="http://www.w3.org/2000/svg" width="1021" height="266" viewBox="0 0 1021 266" role="img" aria-labelledby="title desc">
<title id="title">W542. Design a Pizza Ordering and Fulfillment System (OOD) — architecture</title>
<desc id="desc">Customer → menu/pricing → OrderService → order DB + outbox
                              ↓ payment       ↓ accepted kitchen ticket
                       PaymentGateway    KitchenScheduler
                                              ↓ prep → bake → ready
                                         DispatchService
                                              ↓ driver assigned → picked up → delivered
                              Customer status ← versioned order events
</desc>
