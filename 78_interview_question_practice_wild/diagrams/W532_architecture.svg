<text x="182" y="186" font-size="18" font-weight="700" text-anchor="middle">Proposed order</text>
<text x="182" y="210" font-size="16" font-weight="400" text-anchor="middle">account + instrument</text>
<rect x="410" y="140" width="300" height="104" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
