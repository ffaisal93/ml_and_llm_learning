<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W532 · Design Pre-Trade Risk Checking for an Electronic Trading System</title>
<desc id="desc">Proposed order — account + instrument; Risk gate — synchronous limit check; Positions and reservations — authoritative exposure; Atomic risk reservation — order id + fencing; Execution adapter — send or reject; Fills, cancels and releases — reconcile exposure. Reserve risk before sending; release only from a terminal order outcome so concurrent orders cannot spend the same limit.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#475569"/></marker></defs>
