<title id="title">W537. Stock Trading / Real-Time Quote System Design — architecture</title>
<desc id="desc">User order → auth/risk → order DB + funds reservation/outbox → exchange adapter
                              ↑                                  ↓
                         ledger + status ← execution reconciler / fills

