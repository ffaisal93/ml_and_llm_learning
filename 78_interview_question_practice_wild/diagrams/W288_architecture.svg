<title id="title">W288 · Parallel Batch Image Transformation Pipeline</title>
<desc id="desc">Creative brief — constraints + assets; Project planner — split into stages; Versioned project store — script + scene manifest; Media task DAG — dependencies + budget; Generation workers — render + consistency checks; Reviewed media package — resumable artifacts. Version every scene dependency; a retry must not silently mix incompatible scripts, assets or edits.</desc>
