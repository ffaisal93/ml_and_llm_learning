<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="310" viewBox="0 0 1320 310" role="img" aria-labelledby="title desc">
<title id="title">W400 solution flow</title><desc id="desc">Versioned scene + preferences → Generate / hard-filter poses → Learned feasible-set ranking → Planner revalidation / fallback. No model score or exploration policy can override legality,safety or accessibility constraints.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
