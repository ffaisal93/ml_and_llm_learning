<svg xmlns="http://www.w3.org/2000/svg" width="823" height="378" viewBox="0 0 823 378" role="img" aria-labelledby="title desc">
<title id="title">W421. Core Dump Collection System Design — architecture</title>
<desc id="desc">Host crash → local bounded spool → upload-init API
                                     ↓ scoped multipart upload
                               encrypted object storage
                                     ↓ completed/checksummed manifest
                               durable metadata/outbox
                                     ↓
                        sandboxed symbolication/extraction
                                     ↓
                        searchable crash index / grouping
                                     ↓
                   authorized search → short-lived download URL
</desc>
<rect width="823" height="378" rx="14" fill="#101c30"/>
<text x="32" y="40" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">Host crash → local bounded spool → upload-init API</text>
<text x="32" y="68" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                     ↓ scoped multipart upload</text>
<text x="32" y="96" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                               encrypted object storage</text>
<text x="32" y="124" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                     ↓ completed/checksummed manifest</text>
<text x="32" y="152" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                               durable metadata/outbox</text>
<text x="32" y="180" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                     ↓</text>
<text x="32" y="208" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                        sandboxed symbolication/extraction</text>
<text x="32" y="236" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                     ↓</text>
<text x="32" y="264" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                        searchable crash index / grouping</text>
<text x="32" y="292" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                     ↓</text>
<text x="32" y="320" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                   authorized search → short-lived download URL</text>
</svg>
