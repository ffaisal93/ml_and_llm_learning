<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W050 · Design Prompt Playground</title>
<desc id="desc">One text prompt — saved version or draft text; Version and run API — save + revert + run; Immutable prompt versions — parent + text + current id; Isolated one-shot request — exact captured prompt text; Stateless model adapter — no earlier run context; This run text output — version id + response. Save immutable prompt versions; never include previous runs implicitly in a one-shot call.</desc>
