<svg xmlns="http://www.w3.org/2000/svg" width="757" height="378" viewBox="0 0 757 378" role="img" aria-labelledby="title desc">
<title id="title">W100. MLE Deployment, Monitoring &amp; Latency Optimisation — architecture</title>
<desc id="desc">Validated training run → model + preprocessing/schema + metrics
                                      ↓
                              versioned registry
                                      ↓
                     build / integration / load tests
                                      ↓
                      shadow → canary → live endpoint
                                      ↓
                   prediction logs + delayed outcomes
                                      ↓
                             monitor / rollback
</desc>
