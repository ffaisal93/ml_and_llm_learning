<svg xmlns="http://www.w3.org/2000/svg" width="933" height="322" viewBox="0 0 933 322" role="img" aria-labelledby="title desc">
<title id="title">W054. Evaluating an LLM Agent with Subjective, Nondeterministic Outputs — architecture</title>
<desc id="desc">Frozen tasks + rubric + tool fixtures → paired repeated baseline/new runs
                                                        ↓
                              deterministic checks + blinded human/judge scores
                                                        ↓
                                task-level uncertainty + release-blocker gate
                                                        ↓
                                      shadow → guarded online experiment
                                                        ↓
                                         rollout / investigate / rollback
</desc>
<rect width="933" height="322" rx="14" fill="#101c30"/>
<text x="32" y="40" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">Frozen tasks + rubric + tool fixtures → paired repeated baseline/new runs</text>
<text x="32" y="68" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                                        ↓</text>
<text x="32" y="96" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                              deterministic checks + blinded human/judge scores</text>
<text x="32" y="124" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                                        ↓</text>
<text x="32" y="152" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                task-level uncertainty + release-blocker gate</text>
<text x="32" y="180" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                                        ↓</text>
<text x="32" y="208" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                      shadow → guarded online experiment</text>
<text x="32" y="236" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                                        ↓</text>
<text x="32" y="264" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                         rollout / investigate / rollback</text>
</svg>
