<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">F085 · Image-text retrieval: compatible embeddings and ranked results</title>
<desc id="desc">Text or image query — query encoder version; Embedding search service — same representation space; Catalog vector index — image/text embeddings + ids; Approximate candidates — exact verification if needed; Optional pair reranker — matched content + query; Ranked image/text results — recall + relevance + latency. Enforce access and eligibility before exposing results; index freshness and relevance are different concerns.</desc>
