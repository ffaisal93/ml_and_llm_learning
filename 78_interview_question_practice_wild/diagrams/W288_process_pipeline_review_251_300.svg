<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 270" role="img" aria-labelledby="title"><title id="title">W288 bounded process pipeline and indexed results</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#405570"/></marker></defs><rect width="1360" height="270" fill="#f7f9fc"/><rect x="20" y="65" width="240" height="130" rx="12" fill="white" stroke="#405570" stroke-width="2"/><text x="140" y="110" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#14263b">Input images</text><text x="140" y="145" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#405570">index 0 .. N-1</text><path d="M260 130 H285" fill="none" stroke="#405570" stroke-width="2" marker-end="url(#arrow)"/><rect x="290" y="65" width="240" height="130" rx="12" fill="white" stroke="#405570" stroke-width="2"/><text x="410" y="110" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#14263b">Bounded dispatcher</text><text x="410" y="145" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#405570">at most 2 x workers pending</text><path d="M530 130 H555" fill="none" stroke="#405570" stroke-width="2" marker-end="url(#arrow)"/><rect x="560" y="65" width="240" height="130" rx="12" fill="white" stroke="#405570" stroke-width="2"/><text x="680" y="110" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#14263b">Worker processes</text><text x="680" y="145" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#405570">full ordered transform chain</text><path d="M800 130 H825" fill="none" stroke="#405570" stroke-width="2" marker-end="url(#arrow)"/><rect x="830" y="65" width="240" height="130" rx="12" fill="white" stroke="#405570" stroke-width="2"/><text x="950" y="110" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#14263b">Futures complete</text><text x="950" y="145" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#405570">possibly out of input order</text><path d="M1070 130 H1095" fill="none" stroke="#405570" stroke-width="2" marker-end="url(#arrow)"/><rect x="1100" y="65" width="240" height="130" rx="12" fill="white" stroke="#405570" stroke-width="2"/><text x="1220" y="110" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#14263b">Indexed outputs</text><text x="1220" y="145" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#405570">results[i] or errors[i]</text><text x="680" y="235" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#405570">Transformation exceptions stay per image; a broken process pool is explicitly reported and needs supervised replacement.</text></svg>