<svg xmlns="http://www.w3.org/2000/svg" width="801" height="434" viewBox="0 0 801 434" role="img" aria-labelledby="title desc">
<title id="title">W070. ML System Design: Restaurant / Store Recommendation — architecture</title>
<desc id="desc">Request → open/serviceable/in-stock eligibility
                          ↓
        lexical + two-tower ANN + discovery sources
                          ↓
              merge / filter / candidate budget
                          ↓
             bulk features → daily-trained ranker
                          ↓
           delivery/quality/diversity/ad-slot policy
                          ↓
        results → impressions/orders/ETA outcomes → event bus
                                                     ↓
                          online features + offline training tables
</desc>
