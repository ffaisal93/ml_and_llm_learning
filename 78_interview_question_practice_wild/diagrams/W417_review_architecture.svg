<svg xmlns="http://www.w3.org/2000/svg" width="911" height="322" viewBox="0 0 911 322" role="img" aria-labelledby="title desc">
<title id="title">W417. Realtime Auction Bidding System — architecture</title>
<desc id="desc">REST bid → auth / validation → Kafka partition(auction_id)
                                         ↓ one ordered consumer per partition
                                    bid worker
                                         ↓ transaction
                          MySQL bid history + highest state + outbox
                                         ↓
                             Redis current state / realtime event
                                         ↓
                                 SSE/WebSocket gateways
</desc>
<rect width="911" height="322" rx="14" fill="#101c30"/>
<text x="32" y="40" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">REST bid → auth / validation → Kafka partition(auction_id)</text>
<text x="32" y="68" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                         ↓ one ordered consumer per partition</text>
<text x="32" y="96" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                    bid worker</text>
<text x="32" y="124" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                         ↓ transaction</text>
<text x="32" y="152" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                          MySQL bid history + highest state + outbox</text>
<text x="32" y="180" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                         ↓</text>
<text x="32" y="208" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                             Redis current state / realtime event</text>
<text x="32" y="236" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                         ↓</text>
<text x="32" y="264" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                 SSE/WebSocket gateways</text>
</svg>
