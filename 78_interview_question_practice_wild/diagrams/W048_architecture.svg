<title id="title">W048 · LLM SQL Chatbot Access Control and Query Safety</title>
<desc id="desc">Analytical question — caller + requested metric; SQL planning + policy — authorized schema + intent; Catalog + policy store — tables + columns + row rules; AST + cost validation — join + scan + runtime guards; Isolated Trino executor — scoped identity + quotas; Results or clarification — SQL + policy + resource audit. The resource owner enforces the authorization decision; stale allow decisions need explicit revocation handling.</desc>
