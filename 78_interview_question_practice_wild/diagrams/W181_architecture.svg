<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W181 · ML System Design: Behavior Prediction from Sensor + Camera Data</title>
<desc id="desc">Sensor + camera stream — timestamps; Synchronization layer — calibration + freshness; Maps and model bundle — versioned geometry; Perception pipeline — bounded frame age; Motion policy — safety controller; Actuation + telemetry — safe fallback. Stale or uncertain perception must have a bounded safe fallback; the model is not the sole safety authority.</desc>
