<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W471 · Design a podcast publishing and feed system</title>
<desc id="desc">Publisher upload — episode + feed metadata; Publishing API — permissions + version; Episode metadata + media — durable publication state; Validation/transcode queue — retry + checksums; Feed generator — stable episode ids + cache; RSS and media delivery — subscribers + analytics. Publish feed entries only when their media is ready; stable identifiers prevent duplicate episodes for subscribers.</desc>
