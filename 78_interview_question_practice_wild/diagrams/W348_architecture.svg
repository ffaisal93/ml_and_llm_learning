<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">W348 · Design Search Autocomplete / Typeahead</title>
<desc id="desc">Typed prefix — latest request sequence; Suggestion API — debounce + cancellation; Prefix or search index — popularity + permissions; Bounded candidate lookup — normalized prefix; Suggestion ranking — spelling + policy; UI suggestions — ignore stale responses. An older response must not replace suggestions for a newer prefix; filter results under the current user scope.</desc>
