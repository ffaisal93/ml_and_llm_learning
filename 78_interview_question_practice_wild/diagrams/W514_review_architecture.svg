<svg xmlns="http://www.w3.org/2000/svg" width="779" height="322" viewBox="0 0 779 322" role="img" aria-labelledby="title desc">
<title id="title">W514. Design a Matchmaking Service for Multiplayer Games — architecture</title>
<desc id="desc">Play request → region/mode queue → skill buckets + age index
                                      ↓
                            bounded candidate search
                                      ↓ atomic ticket reservation
                              proposed match / accept
                                      ↓
                             server allocator → ready server
                                      ↓
                             signed connection tickets
</desc>
<rect width="779" height="322" rx="14" fill="#101c30"/>
<text x="32" y="40" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">Play request → region/mode queue → skill buckets + age index</text>
<text x="32" y="68" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                      ↓</text>
<text x="32" y="96" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                            bounded candidate search</text>
<text x="32" y="124" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                      ↓ atomic ticket reservation</text>
<text x="32" y="152" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                              proposed match / accept</text>
<text x="32" y="180" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                      ↓</text>
<text x="32" y="208" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                             server allocator → ready server</text>
<text x="32" y="236" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                                      ↓</text>
<text x="32" y="264" xml:space="preserve" fill="#e5edf9" font-family="monospace" font-size="17">                             signed connection tickets</text>
</svg>
