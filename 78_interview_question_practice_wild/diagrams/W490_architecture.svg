<title id="title">W490 · URL Shortener With Click Tracking</title>
<desc id="desc">Create or redirect request — code + expiry; URL service — validate + rate limit; Durable code mapping — unique code + destination; Async click events — bounded collection; Analytics aggregation — deduplicate + retention; Redirect or owner report — expiry-aware cache. Reserve codes atomically and validate expiry on redirect; analytics must not block every click.</desc>
